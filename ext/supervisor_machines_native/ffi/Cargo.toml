[package]
name = "supervisor_machines_native"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Ruby bindings for the supervisor-machines decision machine"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
supervisor-machines = { workspace = true, features = ["std"] }
magnus = { version = ">= 0.9.3", default-features = false, features = ["io"] }
