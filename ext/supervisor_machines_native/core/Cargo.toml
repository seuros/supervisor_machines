[package]
name = "supervisor-machines"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "OTP-style supervision decisions: restart strategies, restart intensity and escalation - no_std with zero dependencies"
repository = "https://github.com/seuros/supervisor_machines"
keywords = ["supervisor", "supervision-tree", "otp", "restart", "no-std"]
categories = ["no-std", "concurrency"]
readme = "README.md"

[lib]
name = "supervisor_machines"
crate-type = ["lib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true
