name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CORE: ext/supervisor_machines_native/core
  FFI: ext/supervisor_machines_native/ffi

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (mise)
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Lint and test every feature combination
        working-directory: ${{ env.CORE }}
        run: |
          for features in "" alloc std; do
            echo "::group::features: ${features:-none}"
            cargo clippy --no-default-features --features "$features" --all-targets -- -D warnings
            cargo test --no-default-features --features "$features" --lib
            echo "::endgroup::"
          done
      - name: Run doc tests
        working-directory: ${{ env.CORE }}
        run: cargo test --all-features --doc

  test-no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (mise)
        uses: jdx/mise-action@v5
        with:
          install_args: rust
      - name: Build and lint on bare metal
        working-directory: ${{ env.CORE }}
        run: |
          for features in "" alloc; do
            echo "::group::thumbv7em features: ${features:-none}"
            cargo build --no-default-features --features "$features" --target thumbv7em-none-eabihf
            cargo clippy --no-default-features --features "$features" --target thumbv7em-none-eabihf -- -D warnings
            echo "::endgroup::"
          done

  # The extension is required, so there is no engine matrix: CRuby only.
  test-ruby:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            ruby = "4.0"
            rust = { version = "1.99", components = "clippy,rustfmt" }
      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile', '*.gemspec') }}
      - name: Install gems
        run: bundle install --jobs 4
      - name: Check formatting
        run: |
          cargo fmt --check --manifest-path ${{ env.CORE }}/Cargo.toml
          cargo fmt --check --manifest-path ${{ env.FFI }}/Cargo.toml
      - name: Lint the binding crate
        run: cargo clippy --manifest-path ${{ env.FFI }}/Cargo.toml --all-targets -- -D warnings
      - name: Compile the extension
        run: bundle exec rake compile
      - name: Run tests
        run: bundle exec rake test
      - name: Validate signatures
        run: bundle exec rbs -I sig validate
