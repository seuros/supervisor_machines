name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # rb-sys gates part of the magnus API on the Ruby it builds against,
          # so the binding crate needs a Ruby here even though the core does
          # not. Without one, Ruby::define_data is compiled out and the lint
          # fails on a method that exists everywhere it is actually used.
          mise_toml: |
            [tools]
            ruby = "4.0"
            rust = { version = "1.99", components = "clippy,rustfmt" }

      - name: Locate the crates
        id: crates
        run: |
          core=''
          ffi=''
          for dir in ext/*/core; do [ -d "$dir" ] && core="$dir"; done
          for dir in ext/*/ffi; do [ -d "$dir" ] && ffi="$dir"; done
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "ffi=$ffi" >> "$GITHUB_OUTPUT"

      - name: Lint and test every feature combination
        if: steps.crates.outputs.core != ''
        working-directory: ${{ steps.crates.outputs.core }}
        run: |
          for features in "" alloc std; do
            echo "::group::features: ${features:-none}"
            cargo clippy --no-default-features --features "$features" --all-targets -- -D warnings
            cargo test --no-default-features --features "$features" --lib
            echo "::endgroup::"
          done

      - name: Run doc tests
        if: steps.crates.outputs.core != ''
        working-directory: ${{ steps.crates.outputs.core }}
        run: cargo test --all-features --doc

      - name: Lint the binding crate
        if: steps.crates.outputs.ffi != ''
        run: cargo clippy --manifest-path ${{ steps.crates.outputs.ffi }}/Cargo.toml --all-targets -- -D warnings

      - name: Check formatting
        if: steps.crates.outputs.core != ''
        run: |
          cargo fmt --check --manifest-path ${{ steps.crates.outputs.core }}/Cargo.toml
          if [ -n "${{ steps.crates.outputs.ffi }}" ]; then
            cargo fmt --check --manifest-path ${{ steps.crates.outputs.ffi }}/Cargo.toml
          fi

  bare-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - name: Locate the core crate
        id: crates
        run: |
          core=''
          for dir in ext/*/core; do [ -d "$dir" ] && core="$dir"; done
          echo "core=$core" >> "$GITHUB_OUTPUT"

      - name: Build and lint on bare metal
        if: steps.crates.outputs.core != ''
        working-directory: ${{ steps.crates.outputs.core }}
        run: |
          for features in "" alloc; do
            echo "::group::thumbv7em features: ${features:-none}"
            cargo build --no-default-features --features "$features" --target thumbv7em-none-eabihf
            cargo clippy --no-default-features --features "$features" --target thumbv7em-none-eabihf -- -D warnings
            echo "::endgroup::"
          done

  ruby:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            ruby = "4.0"
            rust = { version = "1.99", components = "clippy,rustfmt" }

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile', '*.gemspec') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run tests
        run: bundle exec rake test

      - name: Validate signatures
        run: bundle exec rbs -I sig validate
